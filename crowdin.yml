files:
  - source: /shopping_list/translationfiles/templates/shopping_list.pot
    translation: /shopping_list/translationfiles/%two_letters_code%/shopping_list.po
  - source: /shopping_list/resources/keywords/en.json
    translation: /shopping_list/resources/keywords/%two_letters_code%.json
    type: json
  # Note: parsing packs (resources/parsing/*.json) are NOT translated on Crowdin.
  # They hold technical data (unit aliases, decimal marks) that doesn't fit a
  # 1:1 translation model. Per-language unit packs are contributed via PR; the
  # app falls back to English parsing when a language has none.
